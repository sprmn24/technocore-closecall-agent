# Publishes the browser app (closecall/web) to GitHub Pages on every push to main.
# The app is static: no build step, no secrets, no server.
name: pages
on:
  push:
    branches: [main]
    paths: ["closecall/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/web/core.test.mjs && node tests/web/i18n.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: closecall/web
      - id: deployment
        uses: actions/deploy-pages@v4
