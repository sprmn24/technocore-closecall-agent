name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pinned: new ruff releases add default rules, which would fail CI without any code change
      - run: pip install -e . "ruff==0.16.9"
      - run: ruff check closecall tests --line-length 130
      - run: python -m unittest discover -s tests -v
      - run: closecall --help
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/web/core.test.mjs
      - run: node tests/web/i18n.test.mjs
